name: Bug report
description: Report a reproducible bug using synthetic data.
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerability? Follow SECURITY.md and report privately.
        Do not include tokens, private notes, account IDs, or private repository URLs.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the source revision and Node version.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, client version, and local or deployed mode. Use placeholders for hosts and accounts.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Exact steps and minimal fictional input. Sanitize all output before sharing.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials and personal or internal data from this report.
          required: true
